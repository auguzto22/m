<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Blitz">
  <defs>
    <linearGradient id="bz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1fb8"/>
      <stop offset=".55" stop-color="#4b3df0"/>
      <stop offset="1" stop-color="#7c6bff"/>
    </linearGradient>
    <radialGradient id="bz-glow" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
